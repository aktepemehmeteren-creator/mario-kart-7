name: Build Mario Kart PSP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PSPDEV ile derle
        run: |
          docker pull pspdev/pspdev:latest

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source" \
            -w /source \
            pspdev/pspdev:latest \
            sh -c '
              rm -rf build
              mkdir build
              cd build
              psp-cmake ..
              make -j2
            '

      - name: EBOOT kontrol
        run: |
          test -f build/EBOOT.PBP
          mkdir -p release/PSP/GAME/MARIOKART
          cp build/EBOOT.PBP release/PSP/GAME/MARIOKART/

      - name: Assetleri kopyala
        run: |
          if [ -d assets ]; then
            cp -r assets release/PSP/GAME/MARIOKART/
          fi

      - name: PSP paketi
        uses: actions/upload-artifact@v6
        with:
          name: MarioKartPSP-GAME
          path: release/PSP/GAME/MARIOKART/
