name: Build Mario Kart PSP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: PSPDEV ile derle
        run: |
          docker pull pspdev/pspdev:latest

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source" \
            -w /source \
            pspdev/pspdev:latest \
            sh -c '
              rm -rf build
              mkdir build
              cd build
              psp-cmake ..
              make -j2
            '

      - name: Oyun klasörünü oluştur
        run: |
          mkdir -p release/PSP/GAME/MARIOKART
          cp build/EBOOT.PBP release/PSP/GAME/MARIOKART/

      - name: Texture ve sesleri kopyala
        run: |
          cp -r assets/textures release/PSP/GAME/MARIOKART/
          cp -r assets/audio release/PSP/GAME/MARIOKART/

      - name: Dosyaları kontrol et
        run: |
          echo "=== EBOOT ==="
          ls -lh release/PSP/GAME/MARIOKART/EBOOT.PBP
          echo "=== TEXTURES ==="
          find release/PSP/GAME/MARIOKART/textures -type f | wc -l
          echo "=== AUDIO ==="
          find release/PSP/GAME/MARIOKART/audio -type f | wc -l

      - name: PSP klasörünü artifact olarak yükle
        uses: actions/upload-artifact@v6
        with:
          name: MarioKartPSP-GAME
          path: release/PSP/GAME/MARIOKART/

      - name: EBOOT.PBP yükle
        uses: actions/upload-artifact@v6
        with:
          name: MarioKartPSP-EBOOT-PBP
          path: release/PSP/GAME/MARIOKART/EBOOT.PBP
